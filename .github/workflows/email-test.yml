name: Email test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/email-test-trigger

permissions:
  contents: read

jobs:
  send-test-email:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send test email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: >-
          python -c "from watcher import send_email;
          send_email('[Internship Watcher] Email test successful',
          '<h2>Your internship watcher email is working.</h2><p>SMTP authentication and delivery succeeded. No job state was changed by this test.</p>')"
